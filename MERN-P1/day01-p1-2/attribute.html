<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Tags Example</title>
</head>

<body>

    <!-- Heading -->
    <h1 id="main-heading" class="title">
        Welcome to My Website
    </h1>

    <!-- Paragraph -->
    <p id="intro" class="description" title="Introduction Paragraph">
        This is a simple paragraph that explains what this webpage is about.
        HTML uses elements like headings, paragraphs, and links to organize content.
    </p>

    <!-- Anchor (Link) -->
    <a
        href="https://www.google.com"
        target="_blank"
        title="Visit Google"
        rel="noopener noreferrer">
        Visit Google
    </a>

</body>

</html>
